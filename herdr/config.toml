onboarding = false

[ui.toast]
delivery = "herdr"

[keys]
# moved off prefix+e so the nvim sidebar can use it
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: review the agent's diff"

# >>> furkankly.zoetrope keys (managed: `setup-keys` writes this block, `remove-keys` deletes it)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph (overlay)"

# The graph opens over the focused pane and gives the layout back when
# it closes. The same key closes it. Two other placements, if you would
# rather keep the graph on screen: uncomment one, or point the binding
# above at its action. Then: herdr server reload-config
