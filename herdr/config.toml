onboarding = false

[ui.toast]
delivery = "herdr"

[keys]
# moved off prefix+e so the nvim sidebar can use it
edit_scrollback = "prefix+shift+e"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
